# Render Blueprint — OneRoboLab API (Backend Phase 2).
# Dashboard → New → Blueprint → pick this repository. Secrets are never stored here:
# DATABASE_URL is entered in the dashboard (sync: false), AUTH_SECRET is generated by Render.
services:
  - type: web
    name: onerobolab-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    # --prod=false: NODE_ENV=production would otherwise skip the TypeScript compiler (a devDependency).
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @robolab/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - database/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string (…-pooler…/db?sslmode=require)
      - key: AUTH_SECRET
        generateValue: true  # random, ≥ 32 chars; rotating it signs everyone out
      - key: CORS_ORIGIN
        sync: false          # the web app origin(s), comma-separated, e.g. https://onerobolab.example.com
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: LOGIN_RATE_LIMIT
        value: "10"
      - key: LOGIN_RATE_WINDOW_MINUTES
        value: "15"
      - key: LOG_LEVEL
        value: info
